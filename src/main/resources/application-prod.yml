server:
  port: 8080

spring:
  application:
    name: reggie_take_out
  datasource:
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/reggie?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true}
      username: ${SPRING_DATASOURCE_USERNAME:root}
      password: ${SPRING_DATASOURCE_PASSWORD:Mysql@123456}
      initial-size: 5
      min-idle: 5
      max-active: 30
      max-wait: 20000
      test-while-idle: true
      validation-query: SELECT 1
  redis:
    host: ${SPRING_REDIS_HOST:redis}
    port: ${SPRING_REDIS_PORT:6379}
    password: ${SPRING_REDIS_PASSWORD:1234}
    database: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 生产环境不输出SQL日志，防止敏感信息泄露
  global-config:
    db-config:
      id-type: ASSIGN_ID

reggie:
  path: ${REGGIE_PATH:/app/images/}
  sms:
    expose-code: true

aliyun:
  sms:
    access-key-id: ${ALIYUN_SMS_ACCESS_KEY_ID:dummy}
    access-key-secret: ${ALIYUN_SMS_ACCESS_KEY_SECRET:dummy}
    region-id: cn-hangzhou
    sign-name: 速通互联验证码
    template-code: 100001
