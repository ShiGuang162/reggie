<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0,user-scalable=no,minimal-ui">
    <title>菩提阁</title>
    <link rel="icon" href="./../images/favico.ico">
    <!--element-ui的样式-->
    <link rel="stylesheet" href="../../backend/plugins/element-ui/index.css" />
    <!-- 引入样式  -->
    <link rel="stylesheet" href="../styles/index.css" />
    <!--引入vant样式-->
    <link rel="stylesheet" href="../styles/vant.min.css"/>
    <!--本页面内容的样式-->
    <link rel="stylesheet" href="./../styles/user.css" />
</head>
<body>
    <div id="user" class="app">
        <div class="divHead">
            <div class="divTitle">
                <i class="el-icon-arrow-left" @click="goBack"></i>个人中心
            </div>
            <div class="divUser">
                <img src="./../images/headPage.png"/>
                <div class="desc">
                    <div class="divName">{{userName || '用户'}}<img src="./../images/women.png"/></div>
                    <div class="divPhone">{{userPhone}}</div>
                </div>
            </div>
        </div>
        <div class="divContent">
            <div class="divLinks">
                <div class="item" @click="toAddressPage">
                    <img src="./../images/locations.png"/>
                    <span>地址管理</span>
                    <i class="el-icon-arrow-right"></i>
                </div>
                <div class="divSplit"></div>
                <div class="item" @click="toOrderPage">
                    <img src="./../images/orders.png"/>
                    <span>历史订单</span>
                    <i class="el-icon-arrow-right"></i>
                </div>
            </div>
            <div class="divOrders" v-if="order && order.id">
                <div class="title">最新订单</div>
                <div class="timeStatus">
                    <span>{{formatTime(order.orderTime)}}</span>
                    <span>{{getStatus(order.status)}}</span>
                </div>
                <div class="dishList" v-if="order.orderDetails && order.orderDetails.length">
                    <div v-for="(item,index) in order.orderDetails" :key="index" class="item">
                        <span>{{item.name}}</span>
                        <span>x{{item.number}}</span>
                    </div>
                </div>
                <div class="result">
                    <span>共{{order.sumNum || 0}} 件商品,实付</span>
                    <span class="price">￥{{formatAmount(order.amount)}}</span>
                </div>
                <div class="btn" v-if="order.status === 4">
                    <div class="btnAgain" @click="addOrderAgain">再来一单</div>
                </div>
            </div>
            <div class="divOrders" v-else>
                <div class="title">最新订单</div>
                <div style="text-align:center;padding:20px;color:#999;">暂无订单</div>
            </div>
            <div class="quitLogin" @click="toPageLogin">
                退出登录
            </div>
        </div>
    </div>
    <!-- 开发环境版本，包含了有帮助的命令行警告 -->
    <script src="../../backend/plugins/vue/vue.js"></script>
    <!-- 引入组件库 -->
    <script src="../../backend/plugins/element-ui/index.js"></script>
    <!-- 引入vant组件 -->
    <script src="./../js/vant.min.js"></script>    
    <!--不同屏幕尺寸根字体设置-->
    <script src="./../js/base.js"></script>
    <!-- 引入axios -->
    <script src="../../backend/plugins/axios/axios.min.js"></script>
    <script src="./../js/request.js"></script>
    <script src="./../api/order.js"></script>
    <script src="./../api/login.js"></script>
    <script>
        new Vue({
            el:"#user",
            data(){
                return {
                    form:{
                        phone:'',
                        code:''
                    },
                    msgFlag:false,
                    order: {},
                    /* 必须在 data 中声明，模板才合法且可响应（勿仅在 created 里挂 this.xxx） */
                    userName: '',
                    userPhone: '',
                }
            },
            computed:{},
            created(){
                this.userPhone = sessionStorage.getItem("userPhone") || ''
                this.userName = sessionStorage.getItem("userName") || ''
                this.initData()
            },
            mounted(){},
            methods:{
                goBack(){
                    history.go(-1)
                },
                toAddressPage(){
                    window.location.href = '/front/page/address.html'
                },
                toOrderPage(){
                    window.location.href = '/front/page/order.html'
                },
                initData(){
                    this.getLatestOrder()
                },
                async getLatestOrder(){
                    const params = {
                        page:1,
                        pageSize:1
                    }
                    const res = await orderPagingApi(params)
                    if(res.code === 1 && res.data.records && res.data.records.length > 0){
                        const record = res.data.records[0]
                        // 计算商品总数
                        let number = 0
                        if(record.orderDetails && record.orderDetails.length){
                            record.orderDetails.forEach(item=>{
                                number += item.number || 0
                            })
                        }
                        record.sumNum = number
                        this.order = record
                    }
                },
                formatTime(time){
                    if(!time) return ''
                    const d = new Date(time)
                    return d.getFullYear() + '-' + 
                           String(d.getMonth()+1).padStart(2,'0') + '-' + 
                           String(d.getDate()).padStart(2,'0') + ' ' +
                           String(d.getHours()).padStart(2,'0') + ':' +
                           String(d.getMinutes()).padStart(2,'0')
                },
                formatAmount(amount){
                    if(!amount) return '0.00'
                    // 如果金额小于100，认为单位已经是元，直接显示
                    if(amount < 100) return parseFloat(amount).toFixed(2)
                    // 否则认为是分，除以100
                    return (parseFloat(amount) / 100).toFixed(2)
                },
                getStatus(status){
                    let str = ''
                    switch(status){
                        case 1:
                            str =  '待付款'
                        break;
                        case 2:
                            str =  '正在派送'
                        break;
                        case 3:
                            str =  '已派送'
                        break;
                        case 4:
                            str =  '已完成'
                        break;
                        case 5:
                            str =  '已取消'
                        break;
                        default:
                            str = '未知状态'
                    }
                    return str
                },
                async addOrderAgain(){
                    const res = await orderAgainApi({id: this.order.id})
                    if(res.code === 1){
                        window.location.href = '/front/index.html'
                    }else{
                        this.$notify({ type:'warning', message:res.msg});
                    }
                },
                async toPageLogin(){
                    try {
                        const res = await loginoutApi()
                        if(res.code === 1){
                            sessionStorage.clear()
                            window.location.href = '/front/page/login.html'
                        }else{
                            this.$notify({ type:'warning', message:res.msg || '退出失败'});
                        }
                    } catch (e) {
                        /* 例如后端未部署 /user/loginout 时 axios 会 404，避免未捕获的 Promise 报错 */
                        this.$notify({ type:'warning', message:'退出接口异常，已清除本地登录信息'});
                        sessionStorage.clear()
                        window.location.href = '/front/page/login.html'
                    }
                }
            }
        })
    </script>
</body>
</html>
